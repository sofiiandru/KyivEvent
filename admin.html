<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адміністрування подій</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="admin.html">Адміністрування</a></li>
        </ul>
    </nav>

    <!-- Форма для додавання події -->
    <section id="add-event-section">
        <h2>Додати подію</h2>
        <form>
            <label for="event-name">Назва події:</label>
            <input type="text" id="event-name" required><br>
            
            <label for="event-date">Дата:</label>
            <input type="date" id="event-date" required><br>
            
            <label for="event-price">Ціна:</label>
            <input type="number" id="event-price" required><br>
            
            <label for="event-description">Опис:</label>
            <textarea id="event-description" required></textarea><br>
            
            <label for="event-category">Категорія:</label>
            <select id="event-category">
                <option value="concert">Концерт/Вистава</option>
                <option value="masterclass">Майстер-клас</option>
            </select><br>
            
            <button type="submit">Додати подію</button>
        </form>
    </section>

    <!-- Підвал -->
    <footer>
        <p id="footer-text">KYIV EVENT - поринай у веселощі | Kyiv Event - Dive into Fun</p>
        <p id="footer-text1">Контакти: +380 12 345 67 89 | email@example.com</p>
        <p id="footer-text2">Розробник: Андрущенко Софія ФІТ 2-11</p>
    </footer>
</body>
<script src="script.js"></script>
</html>
